name: Auto Build & Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate VERSION and check existing tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f VERSION ]]; then
            echo "::error title=VERSION file missing::Add a VERSION file to the repository root (for example: v1.0.20)."
            exit 1
          fi

          TAG="$(sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' VERSION)"

          if [[ -z "$TAG" ]]; then
            echo "::error title=VERSION file is empty::Set VERSION to a value such as v1.0.20."
            exit 1
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error title=Invalid version format::'$TAG' is invalid. Use vMAJOR.MINOR.PATCH, for example v1.0.20."
            exit 1
          fi

          echo "Requested release version: $TAG"

          set +e
          git ls-remote --exit-code --tags origin \
            "refs/tags/${TAG}" "refs/tags/${TAG}^{}" \
            > /tmp/existing-tags.txt 2> /tmp/tag-check-error.txt
          CHECK_STATUS=$?
          set -e

          if [[ "$CHECK_STATUS" -eq 0 ]]; then
            echo "::error title=Version already exists::Tag '$TAG' already exists. Update VERSION before starting a new build."
            cat /tmp/existing-tags.txt
            exit 1
          elif [[ "$CHECK_STATUS" -ne 2 ]]; then
            echo "::error title=Could not check remote tags::Git returned exit code $CHECK_STATUS. Build cancelled to avoid creating a duplicate release."
            cat /tmp/tag-check-error.txt
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Version validation passed: $TAG"

  build:
    name: Build ${{ needs.validate-version.outputs.tag }} - ${{ matrix.platform }}
    needs: validate-version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows-x64
            runner: windows-latest
            filename: XomScanner-Windows-64x.exe
            sep: ";"
          - platform: Linux-x64
            runner: ubuntu-24.04
            filename: XomScanner-Linux-64x
            sep: ":"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linux build dependencies (with retries)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive

          APT_OPTIONS=(
            -o Acquire::Retries=5
            -o Acquire::http::Timeout=30
            -o Acquire::https::Timeout=30
            -o Acquire::Queue-Mode=access
          )

          for attempt in 1 2 3 4 5; do
            echo "APT dependency installation attempt ${attempt}/5"

            if sudo apt-get "${APT_OPTIONS[@]}" update && \
               sudo apt-get "${APT_OPTIONS[@]}" install -y --no-install-recommends \
                 build-essential libpcap-dev libffi-dev; then
              echo "Linux build dependencies installed successfully."
              exit 0
            fi

            if [[ "$attempt" -lt 5 ]]; then
              delay=$((attempt * 15))
              echo "::warning::APT failed (often due to temporary DNS/network issues). Retrying in ${delay}s..."
              sleep "$delay"
            fi
          done

          echo "::error title=APT installation failed::Could not update package indexes or install Linux build dependencies after 5 attempts. Check runner DNS/network availability and rerun the workflow."
          exit 1

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip wheel
          pip install pyinstaller
          pip install -r requirements.txt
          pip install cryptography PySocks requests urllib3 scapy faker paramiko

      - name: Build with PyInstaller (fast onefile)
        shell: bash
        run: |
          set -euo pipefail
          ADD_DATA=""
          if python -c "import scapy, pathlib; print(pathlib.Path(scapy.__file__).parent)" 2>/dev/null; then
            SCAPY_DIR=$(python -c "import scapy, pathlib; print(pathlib.Path(scapy.__file__).parent)")
            ADD_DATA="--add-data=${SCAPY_DIR}${{ matrix.sep }}scapy"
          fi
          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --name "${{ matrix.filename }}" \
            --paths . \
            --hidden-import=brute \
            --hidden-import=scanner \
            --hidden-import=proxy_tester \
            --hidden-import=word_list \
            --hidden-import=xss \
            --hidden-import=scan_win \
            --hidden-import=email_checker \
            --hidden-import=username_finder \
            --hidden-import=attacks_modern \
            --hidden-import=osint \
            --hidden-import=osint.ip_intel \
            --hidden-import=osint.metadata \
            --hidden-import=osint.username_finder \
            --hidden-import=xsspor \
            --hidden-import=xsspor.engine \
            --hidden-import=xsspor.payloads \
            --hidden-import=xsspor.context \
            --hidden-import=xsspor.browser \
            --hidden-import=xsspor.proxy \
            --hidden-import=xsspor.crawler \
            --hidden-import=xsspor.chain \
            --hidden-import=socks \
            --hidden-import=faker \
            --hidden-import=paramiko \
            --hidden-import=cryptography \
            --hidden-import=scapy \
            --hidden-import=scapy.all \
            --collect-all=scapy \
            --collect-all=cryptography \
            --exclude-module=playwright \
            --exclude-module=pytest \
            --exclude-module=unittest \
            --exclude-module=tkinter \
            --exclude-module=matplotlib \
            --exclude-module=PyQt5 \
            --exclude-module=PySide2 \
            $ADD_DATA \
            runner_code.py

          mkdir -p dist
          if [ ! -f "dist/${{ matrix.filename }}" ]; then
            FOUND=$(find dist -maxdepth 1 -type f \
              \( -name 'XomScanner*' -o -name 'runner_code*' \) | head -1)
            if [ -n "$FOUND" ]; then
              mv "$FOUND" "dist/${{ matrix.filename }}"
            fi
          fi
          ls -la dist/
          test -f "dist/${{ matrix.filename }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/${{ matrix.filename }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create Release ${{ needs.validate-version.outputs.tag }}
    needs: [validate-version, build]
    if: success()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-version.outputs.tag }}
          name: XomScanner ${{ needs.validate-version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            # XomScanner ${{ needs.validate-version.outputs.tag }}

            ## Downloads
            - **Windows x64:** `XomScanner-Windows-64x.exe`
            - **Linux x64:** `XomScanner-Linux-64x`

            ## Version
            `${{ needs.validate-version.outputs.tag }}`

            ---
            Built with **PyInstaller** via GitHub Actions.
          files: release/*
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
