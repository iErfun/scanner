name: Windows Build & GitHub Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xomscanner-release
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate VERSION
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate VERSION and check remote tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f VERSION ]]; then
            echo "::error::VERSION file is missing from the repository root."
            exit 1
          fi

          TAG="$(tr -d '\r\n' < VERSION | xargs)"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid VERSION '$TAG'. Expected vMAJOR.MINOR.PATCH, e.g. v1.0.20."
            exit 1
          fi

          REMOTE_TAGS="$(git ls-remote --tags origin "refs/tags/${TAG}" "refs/tags/${TAG}^{}")"
          if [[ -n "$REMOTE_TAGS" ]]; then
            echo "::error::Tag '$TAG' already exists on origin. Change VERSION before releasing."
            echo "$REMOTE_TAGS"
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Validated release tag: $TAG"

  build-windows:
    name: Build Windows x64
    needs: validate-version
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt
          python -m pip install cryptography PySocks requests urllib3 scapy faker paramiko

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name "XomScanner-Windows-64x" `
            --paths . `
            --hidden-import=brute `
            --hidden-import=scanner `
            --hidden-import=proxy_tester `
            --hidden-import=word_list `
            --hidden-import=xss `
            --hidden-import=scan_win `
            --hidden-import=email_checker `
            --hidden-import=username_finder `
            --hidden-import=attacks_modern `
            --hidden-import=osint `
            --hidden-import=osint.ip_intel `
            --hidden-import=osint.metadata `
            --hidden-import=osint.username_finder `
