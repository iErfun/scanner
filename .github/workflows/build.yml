
name: Auto Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows-x64
            runner: windows-latest
            filename: RB-Windows-x64.exe

          - platform: Linux-x64
            runner: ubuntu-latest
            filename: RB-Linux-x64

          - platform: macOS-ARM64
            runner: macos-latest
            filename: RB-macOS-ARM64

          - platform: macOS-x64
            runner: macos-15-intel
            filename: RB-macOS-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential patchelf ccache libpcap-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka ordered-set zstandard requests pysocks scapy

      - name: Build with Nuitka
        shell: bash
        run: |
          python -m nuitka \
            --mode=onefile \
            --assume-yes-for-downloads \
            --output-dir=dist \
            --output-filename="${{ matrix.filename }}" \
            --follow-imports \
            --include-module=brute \
            --include-module=scanner \
            --include-module=proxy_tester \
            --include-module=word_list \
            --include-module=xss \
            --include-module=scan_win \
            --include-package=osint \
            --include-package=scapy \
            --include-package-data=scapy \
            runner_code.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/${{ matrix.filename }}
          if-no-files-found: error

  release:
    name: Create Automatic Release
    needs: build
    if: success()
    runs-on: ubuntu-latest

    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate version
        id: version
        run: |
          echo "tag=v1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: RB ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: release/*
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
