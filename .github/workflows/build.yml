name: Auto Build & Release
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: auto-release
  cancel-in-progress: true
jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows-x64
            runner: windows-latest
            filename: XomScanner-Windows-64x.exe
            sep: ";"
          - platform: Linux-x64
            runner: ubuntu-latest
            filename: XomScanner-Linux-64x
            sep: ":"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libpcap-dev libffi-dev
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip wheel
          pip install pyinstaller
          pip install -r requirements.txt
          pip install cryptography PySocks requests urllib3 scapy faker paramiko
      - name: Build with PyInstaller (fast onefile)
        shell: bash
        run: |
          set -euo pipefail
          ADD_DATA=""
          if python -c "import scapy, pathlib; print(pathlib.Path(scapy.__file__).parent)" 2>/dev/null; then
            SCAPY_DIR=$(python -c "import scapy, pathlib; print(pathlib.Path(scapy.__file__).parent)")
            ADD_DATA="--add-data=${SCAPY_DIR}${{ matrix.sep }}scapy"
          fi
          pyinstaller \
            --noconfirm \
            --clean \
            --onefile \
            --name "${{ matrix.filename }}" \
            --paths . \
            --hidden-import=brute \
            --hidden-import=scanner \
            --hidden-import=proxy_tester \
            --hidden-import=word_list \
            --hidden-import=xss \
            --hidden-import=scan_win \
            --hidden-import=email_checker \
            --hidden-import=username_finder \
            --hidden-import=attacks_modern \
            --hidden-import=osint \
            --hidden-import=osint.ip_intel \
            --hidden-import=osint.metadata \
            --hidden-import=osint.username_finder \
            --hidden-import=xsspor \
            --hidden-import=xsspor.engine \
            --hidden-import=xsspor.payloads \
            --hidden-import=xsspor.context \
            --hidden-import=xsspor.browser \
            --hidden-import=xsspor.proxy \
            --hidden-import=xsspor.crawler \
            --hidden-import=xsspor.chain \
            --hidden-import=socks \
            --hidden-import=faker \
            --hidden-import=paramiko \
            --hidden-import=cryptography \
            --hidden-import=scapy \
            --hidden-import=scapy.all \
            --collect-all=scapy \
            --collect-all=cryptography \
            --exclude-module=playwright \
            --exclude-module=pytest \
            --exclude-module=unittest \
            --exclude-module=tkinter \
            --exclude-module=matplotlib \
            --exclude-module=PyQt5 \
            --exclude-module=PySide2 \
            $ADD_DATA \
            runner_code.py
          mkdir -p dist
          if [ ! -f "dist/${{ matrix.filename }}" ]; then
            FOUND=$(find dist -maxdepth 1 -type f \( -name 'XomScanner*' -o -name 'runner_code*' \) | head -1)
            if [ -n "$FOUND" ]; then
              mv "$FOUND" "dist/${{ matrix.filename }}"
            fi
          fi
          ls -la dist/
          test -f "dist/${{ matrix.filename }}"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/${{ matrix.filename }}
          if-no-files-found: error
          retention-days: 14
  release:
    name: Create Automatic Release
    needs: build
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate Version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LATEST_TAG=$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName // ""' || true)
          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v1.0.8"
          else
            echo "Latest Release: $LATEST_TAG"
            if [[ "$LATEST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"
              PATCH=$((PATCH + 1))
              NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
            else
              echo "Invalid release tag: $LATEST_TAG — falling back to v1.0.8"
              NEW_TAG="v1.0.8"
            fi
          fi
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Next Release: $NEW_TAG"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            # XomScanner
            ## Downloads
            - **Windows x64:** `XomScanner-Windows-64x.exe`
            - **Linux x64:** `XomScanner-Linux-64x`
            ## Version
            `${{ steps.version.outputs.tag }}`
            ---
            Built with **PyInstaller** (fast CI) via GitHub Actions.
          files: release/*
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
