name: Windows Build & GitHub Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xomscanner-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate VERSION
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      tag_exists: ${{ steps.version.outputs.tag_exists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate VERSION and inspect remote tag
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          if (!(Test-Path "VERSION")) {
            throw "VERSION file not found in repository root."
          }

          $tag = (Get-Content "VERSION" -Raw).Trim()
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid VERSION '$tag'. Expected format: v1.2.3"
          }

          # Check whether this tag already exists on origin.
          $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not query remote tags. Check repository network/access."
          }

          $tagExists = "false"
          if ($remoteTag) {
            # A previous run may have pushed the tag but failed before publishing.
            # Permit recovery if no GitHub Release exists yet.
            gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -eq 0) {
              throw "Tag '$tag' and its GitHub Release already exist. Change VERSION."
            }
            $tagExists = "true"
            Write-Host "Tag '$tag' exists, but its Release is missing. Will repair the Release."
          } else {
            Write-Host "Tag '$tag' does not exist yet. It will be created during release."
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "tag_exists=$tagExists" >> $env:GITHUB_OUTPUT

  build:
    name: Build Windows x64
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt
          python -m pip install cryptography PySocks requests urllib3 scapy faker paramiko

      - name: Build EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          # Use an argument array instead of PowerShell backtick continuations.
          # This guarantees runner_code.py is passed as PyInstaller's scriptname.
          $pyinstallerArgs = @(
            "--noconfirm"
            "--clean"
            "--onefile"
            "--name"
            "XomScanner-Windows-64x"
            "--paths"
            "."
            "--hidden-import=brute"
            "--hidden-import=scanner"
            "--hidden-import=proxy_tester"
            "--hidden-import=word_list"
            "--hidden-import=xss"
            "--hidden-import=scan_win"
            "--hidden-import=email_checker"
            "--hidden-import=username_finder"
            "--hidden-import=attacks_modern"
            "--hidden-import=osint"
            "--hidden-import=osint.ip_intel"
            "--hidden-import=osint.metadata"
            "--hidden-import=osint.username_finder"
            "--hidden-import=xsspor"
            "--hidden-import=xsspor.engine"
            "--hidden-import=xsspor.payloads"
            "--hidden-import=xsspor.context"
            "--hidden-import=xsspor.browser"
            "--hidden-import=xsspor.proxy"
            "--hidden-import=xsspor.crawler"
            "--hidden-import=xsspor.chain"
            "--hidden-import=socks"
            "--hidden-import=faker"
            "--hidden-import=paramiko"
            "--hidden-import=cryptography"
            "--hidden-import=scapy"
            "--hidden-import=scapy.all"
            "--collect-all=scapy"
            "--collect-all=cryptography"
            "--exclude-module=playwright"
            "--exclude-module=pytest"
            "--exclude-module=unittest"
            "--exclude-module=tkinter"
            "--exclude-module=matplotlib"
            "--exclude-module=PyQt5"
            "--exclude-module=PySide2"
          )

          & python -m PyInstaller @pyinstallerArgs "runner_code.py"
          if ($LASTEXITCODE -ne 0) {
            throw "PyInstaller failed with exit code $LASTEXITCODE"
          }

          $exe = "dist/XomScanner-Windows-64x.exe"
          if (!(Test-Path $exe)) {
            throw "Build failed: $exe was not generated."
          }
          Get-Item $exe | Format-List Name, Length

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: XomScanner-Windows-x64
          path: dist/XomScanner-Windows-64x.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create Git Tag and GitHub Release
    needs: [validate, build]
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: XomScanner-Windows-x64
          path: release-assets

      - name: Create tag and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.validate.outputs.tag }}
          TAG_EXISTS: ${{ needs.validate.outputs.tag_exists }}
        run: |
          $ErrorActionPreference = "Stop"

          $asset = "release-assets/XomScanner-Windows-64x.exe"
          if (!(Test-Path $asset)) {
            throw "Release asset not found: $asset"
          }

          # Create and push the exact tag from VERSION, unless a previous
          # incomplete run already created it.
          if ($env:TAG_EXISTS -ne "true") {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag $env:TAG $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "Could not create local tag $env:TAG" }

            git push origin "refs/tags/$env:TAG"
            if ($LASTEXITCODE -ne 0) { throw "Could not push tag $env:TAG. Check Actions write permissions." }
          }

          $title = "XomScanner $env:TAG"
          $notes = @"
          # XomScanner $env:TAG

          ## Downloads
          - **Windows x64:** XomScanner-Windows-64x.exe

          ## Version
          $env:TAG

          ---
          Built with PyInstaller via GitHub Actions.
          "@

          gh release create $env:TAG $asset `
            --repo $env:GITHUB_REPOSITORY `
            --title $title `
            --notes $notes `
            --target $env:GITHUB_SHA `
            --latest

          if ($LASTEXITCODE -ne 0) {
            throw "gh release create failed. See the error above; the tag may already exist, in which case rerun to repair the missing Release."
          }

          gh release view $env:TAG --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw "Release verification failed for $env:TAG" }
