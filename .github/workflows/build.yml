name: Auto Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Windows-x64
            runner: windows-latest
            filename: Xomslx-Scanner-Windows-64x.exe

          - platform: Linux-x64
            runner: ubuntu-latest
            filename: Xomslx-Scanner-Linux-64x

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential patchelf ccache libpcap-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka ordered-set zstandard requests pysocks scapy

      - name: Build with Nuitka
        shell: bash
        run: |
          python -m nuitka \
            --mode=onefile \
            --assume-yes-for-downloads \
            --output-dir=dist \
            --output-filename="${{ matrix.filename }}" \
            --follow-imports \
            --include-module=brute \
            --include-module=scanner \
            --include-module=proxy_tester \
            --include-module=word_list \
            --include-module=xss \
            --include-module=scan_win \
            --include-package=osint \
            --include-package=scapy \
            --include-package-data=scapy \
            runner_code.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: dist/${{ matrix.filename }}
          if-no-files-found: error

  release:
    name: Create Automatic Release
    needs: build
    if: success()
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download all builds
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: Generate Version
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          LATEST_TAG=$(gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 1 \
            --json tagName \
            --jq '.[0].tagName // ""')

          if [ -z "$LATEST_TAG" ]; then
            NEW_TAG="v2.0.0"
          else
            echo "Latest Release: $LATEST_TAG"

            if [[ "$LATEST_TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              MAJOR="${BASH_REMATCH[1]}"
              MINOR="${BASH_REMATCH[2]}"
              PATCH="${BASH_REMATCH[3]}"

              PATCH=$((PATCH + 1))
              NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
            else
              echo "Invalid release tag: $LATEST_TAG"
              exit 1
            fi
          fi

          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "Next Release: $NEW_TAG"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            # Xomslx-Scanner

            ## Downloads

            - **Windows x64:** `Xomslx-Scanner-Windows-64x.exe`
            - **Linux x64:** `Xomslx-Scanner-Linux-64x`

            ## Version
            ${{ steps.version.outputs.tag }}

            ---
            Automatically built and released using GitHub Actions.
          files: release/*
          generate_release_notes: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
