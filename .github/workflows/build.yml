name: Windows Build & GitHub Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xomscanner-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate VERSION
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      tag_exists: ${{ steps.version.outputs.tag_exists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate VERSION and inspect remote tag
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"

          if (!(Test-Path "VERSION")) {
            throw "VERSION file not found in repository root."
          }

          $tag = (Get-Content "VERSION" -Raw).Trim()
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid VERSION '$tag'. Expected format: v1.2.3"
          }

          # Check whether this tag already exists on origin.
          $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not query remote tags. Check repository network/access."
          }

          $tagExists = "false"
          if ($remoteTag) {
            # A previous run may have pushed the tag but failed before publishing.
            # Permit recovery if no GitHub Release exists yet.
            gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
            if ($LASTEXITCODE -eq 0) {
              throw "Tag '$tag' and its GitHub Release already exist. Change VERSION."
            }
            $tagExists = "true"
            Write-Host "Tag '$tag' exists, but its Release is missing. Will repair the Release."
          } else {
            Write-Host "Tag '$tag' does not exist yet. It will be created during release."
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "tag_exists=$tagExists" >> $env:GITHUB_OUTPUT

  build:
    name: Build Windows x64
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install pyinstaller
          python -m pip install -r requirements.txt
          python -m pip install cryptography PySocks requests urllib3 scapy faker paramiko

      - name: Build EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          pyinstaller `
            --noconfirm `
            --clean `
